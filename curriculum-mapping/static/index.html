<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dual Translate mapping curriculum</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f6f4ef; --paper: #fffdf8; --ink: #1c1917; --muted: #57534e;
      --line: #e7e5e4; --accent: #1d4ed8; --warn-bg: #fef3c7;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
    header { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
    header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
    header p { margin: 0; color: var(--muted); max-width: 90ch; }
    header a { color: var(--accent); }
    .claim { margin: 10px 22px 0; background: var(--warn-bg); border: 1px solid #fde68a; padding: 8px 12px; max-width: 95ch; }
    .tabs { display: flex; gap: 8px; padding: 12px 22px 0; }
    .tabs button, .btn {
      font: inherit; border: 1px solid var(--line); background: var(--paper);
      padding: 6px 12px; cursor: pointer;
    }
    .tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 160px); }
    .sidebar { border-right: 1px solid var(--line); overflow: auto; background: var(--paper); }
    .sidebar button {
      display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; padding: 10px 12px; cursor: pointer; font: inherit;
    }
    .sidebar button.active { background: #eff6ff; }
    .sidebar .sub { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .main { padding: 16px 22px 40px; overflow: auto; }
    .path { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    article.md { background: var(--paper); border: 1px solid var(--line); padding: 18px 20px; max-width: 52rem; }
    article.md h1 { font-size: 1.35rem; margin: 0 0 0.8rem; }
    article.md h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
    article.md code { font-family: var(--mono); font-size: 0.86em; background: #f5f5f4; padding: 0.1em 0.35em; }
    article.md pre { background: #1c1917; color: #fafaf9; padding: 12px; overflow-x: auto; font-size: 12px; }
    article.md pre code { background: none; color: inherit; }
    article.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
    article.md th, article.md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
    article.md blockquote { border-left: 3px solid var(--accent); margin: 1rem 0; padding: 8px 12px; color: var(--muted); background: #f8fafc; }
    .err { color: #9f1239; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .sidebar { max-height: 32vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Dual Translate mapping curriculum</h1>
    <p>
      Beginner path through the frozen 2026-09-11 Dual map.
      Companion <a href="http://127.0.0.1:8263/">map viewer :8263</a>.
      Locator <a href="http://127.0.0.1:8260/">:8260</a> is frozen and not this track.
    </p>
  </header>
  <div class="claim" id="claim">Loading…</div>
  <div class="tabs">
    <button type="button" class="active" id="tabModules">Modules</button>
    <button type="button" id="tabCurriculum">Overview</button>
    <a class="btn" href="http://127.0.0.1:8263/" target="_blank" rel="noopener">Open map viewer</a>
  </div>
  <div class="layout">
    <nav class="sidebar" id="nav"></nav>
    <div class="main">
      <div class="path" id="sourcePath"></div>
      <article class="md" id="article">Loading…</article>
    </div>
  </div>
  <script>
    let meta = null;
    let currentId = "00";
    let mode = "module";
    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    function renderNav() {
      const nav = document.getElementById("nav");
      nav.innerHTML = "";
      for (const m of meta.modules) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = m.id === currentId && mode === "module" ? "active" : "";
        b.innerHTML = `${m.title}<div class="sub">${m.file}</div>`;
        b.onclick = () => loadModule(m.id);
        nav.appendChild(b);
      }
    }
    async function loadModule(id) {
      mode = "module";
      currentId = id;
      document.getElementById("tabModules").classList.add("active");
      document.getElementById("tabCurriculum").classList.remove("active");
      const data = await api("/api/module?id=" + encodeURIComponent(id));
      document.getElementById("sourcePath").textContent = data.source_path;
      document.getElementById("article").innerHTML = marked.parse(data.markdown || "");
      await api("/api/progress", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current_module: id }),
      });
      renderNav();
      document.querySelector(".main").scrollTop = 0;
    }
    async function loadCurriculum() {
      mode = "curriculum";
      currentId = null;
      document.getElementById("tabCurriculum").classList.add("active");
      document.getElementById("tabModules").classList.remove("active");
      const data = await api("/api/curriculum");
      document.getElementById("sourcePath").textContent = data.source_path;
      document.getElementById("article").innerHTML = marked.parse(data.markdown || "");
      renderNav();
      document.querySelector(".main").scrollTop = 0;
    }
    async function boot() {
      try {
        meta = await api("/api/meta");
        document.getElementById("claim").textContent = meta.claim;
        currentId = (meta.progress && meta.progress.current_module) || "00";
        renderNav();
        document.getElementById("tabModules").onclick = () => loadModule(currentId || "00");
        document.getElementById("tabCurriculum").onclick = loadCurriculum;
        await loadModule(currentId);
      } catch (e) {
        document.getElementById("article").innerHTML = '<p class="err">' + String(e) + "</p>";
      }
    }
    boot();
  </script>
</body>
</html>
